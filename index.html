<!doctype html>
<!-- Copie publique « Présentation ROI » (GitHub Pages). Entrée : ./main.tsx.
     Sombre PAR DÉFAUT (08/10, « la page ici aussi avec fond gris ») : la démo
     est un outil de présentation client — le pré-paint pose data-theme (dark
     sauf choix explicite 'light' du visiteur, que la bascule ☀️/🌙 écrit) et
     main.tsx aligne le store. L'app interne suit toujours sa préférence. -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Présentation ROI — démo</title>
    <meta
      name="description"
      content="Démo interactive : retour sur investissement GTB — investissement, économies, payback et primes CEE."
    />
    <meta name="robots" content="noindex" />
    <!-- Aperçu de lien (SMS, WhatsApp, mail, LinkedIn) : sans ces balises, un
         lien partagé à un prospect s'affiche nu. L'image est générée par
         scripts/share/og-image.mjs et copiée depuis src/share/public/. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IZIT — Présentation ROI" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Présentation ROI — démo interactive" />
    <meta
      property="og:description"
      content="De la facture du prospect au deck client : économies, primes CEE et cadre réglementaire, chiffrés en un rendez-vous."
    />
    <meta property="og:url" content="https://nath333.github.io/demo-roi-gtb/" />
    <meta property="og:image" content="https://nath333.github.io/demo-roi-gtb/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Présentation ROI — démo interactive IZIT" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Présentation ROI — démo interactive" />
    <meta
      name="twitter:description"
      content="De la facture du prospect au deck client : économies, primes CEE et cadre réglementaire."
    />
    <meta name="twitter:image" content="https://nath333.github.io/demo-roi-gtb/og-image.png" />
    <meta name="theme-color" content="#0b1220" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2310b981'/%3E%3Cpath d='M9 22V10h3l4 6 4-6h3v12h-3v-6.5L16 20l-4-4.5V22z' fill='white'/%3E%3C/svg%3E"
    />
    <script>
      (function () {
        try {
          var m = localStorage.getItem('izit-theme-mode');
          document.documentElement.setAttribute('data-theme', m === 'light' ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <script type="module" crossorigin src="/demo-roi-gtb/assets/index-DU50Pkiz.js"></script>
    <link rel="stylesheet" crossorigin href="/demo-roi-gtb/assets/index-_uAQeXzl.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
